document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

9<\u002Fspan><span>#a8a7a1<\u002Fspan>\n        <span style=\"display:flex;gap:3px;\"><span style=\"width:14px;height:14px;border-radius:3px;background:#83827c;\"><\u002Fspan><span style=\"width:14px;height:14px;border-radius:3px;background:#7c7b75;\"><\u002Fspan><\u002Fspan><span><b>fg-3<\u002Fb> meta, flat/neg delta<\u002Fspan><span>#83827c<\u002Fspan><span>#7c7b75<\u002Fspan>\n        <span style=\"display:flex;gap:3px;\"><span style=\"width:14px;height:14px;border-radius:3px;background:#2a78d6;\"><\u002Fspan><span style=\"width:14px;height:14px;border-radius:3px;background:#4a90e2;\"><\u002Fspan><\u002Fspan><span><b>accent<\u002Fb> people metric, action, external<\u002Fspan><span>#2a78d6<\u002Fspan><span>#4a90e2<\u002Fspan>\n        <span style=\"display:flex;gap:3px;\"><span style=\"width:14px;height:14px;border-radius:3px;background:#e7eefa;\"><\u002Fspan><span style=\"width:14px;height:14px;border-radius:3px;background:#1a2a3d;\"><\u002Fspan><\u002Fspan><span><b>accent-soft<\u002Fb> glyph bg<\u002Fspan><span>#e7eefa<\u002Fspan><span>#1a2a3d<\u002Fspan>\n        <span style=\"display:flex;gap:3px;\"><span style=\"width:14px;height:14px;border-radius:3px;background:#1f8a4c;\"><\u002Fspan><span style=\"width:14px;height:14px;border-radius:3px;background:#4cbf7a;\"><\u002Fspan><\u002Fspan><span><b>pos<\u002Fb> positive change only<\u002Fspan><span>#1f8a4c<\u002Fspan><span>#4cbf7a<\u002Fspan>\n        <span style=\"display:flex;gap:3px;\"><span style=\"width:14px;height:14px;border-radius:3px;background:#e4f3ea;\"><\u002Fspan><span style=\"width:14px;height:14px;border-radius:3px;background:#16291d;\"><\u002Fspan><\u002Fspan><span><b>pos-soft<\u002Fb> delta pill<\u002Fspan><span>#e4f3ea<\u002Fspan><span>#16291d<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"font-size:12px;color:#5f5e59;line-height:1.5;text-wrap:pretty;\">Dark accent is lifted to #4a90e2 to keep 4.5:1 on dark surfaces. Negative change is never red — it uses fg-3 with ↓: a dip in visits isn't an alarm.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#fff;border:1px solid #e3e2de;border-radius:10px;padding:24px;display:flex;flex-direction:column;gap:16px;font-size:13px;line-height:1.5;\">\n      <div style=\"font-size:15px;font-weight:650;\">Type · space · radius<\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-variant-numeric:tabular-nums;\">\n        <span style=\"color:#83827c;\">Font<\u002Fspan><span>system-ui stack; numbers always <code>tabular-nums<\u002Fcode>, right-aligned<\u002Fspan>\n        <span style=\"color:#83827c;\">30 / 600<\u002Fspan><span>KPI value (24 on mobile)<\u002Fspan>\n        <span style=\"color:#83827c;\">24 / 650<\u002Fspan><span>Repo title (detail)<\u002Fspan>\n        <span style=\"color:#83827c;\">15 / 600<\u002Fspan><span>Card title, repo name, row value<\u002Fspan>\n        <span style=\"color:#83827c;\">14 / 400<\u002Fspan><span>Body, event text<\u002Fspan>\n        <span style=\"color:#83827c;\">13 / 400<\u002Fspan><span>Description, table cell<\u002Fspan>\n        <span style=\"color:#83827c;\">12 / 500<\u002Fspan><span>Label, delta, meta<\u002Fspan>\n        <span style=\"color:#83827c;\">Space<\u002Fspan><span>4 · 8 · 12 · 16 · 24 · 32 (desktop gutter 40, mobile 16)<\u002Fspan>\n        <span style=\"color:#83827c;\">Radius<\u002Fspan><span>4 pill/glyph · 8 control · 10 card<\u002Fspan>\n        <span style=\"color:#83827c;\">Hit area<\u002Fspan><span>44px min on mobile (period, mark seen, sections)<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"font-size:15px;font-weight:650;padding-top:4px;\">Event glyphs<\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:8px;font-size:12px;\">\n        <span style=\"display:flex;gap:6px;align-items:center;\"><span style=\"width:22px;height:22px;border-radius:4px;background:#efeeea;color:#5f5e59;display:grid;place-items:center;\">★<\u002Fspan>Star<\u002Fspan>\n        <span style=\"display:flex;gap:6px;align-items:center;\"><span style=\"width:22px;height:22px;border-radius:4px;background:#efeeea;color:#5f5e59;display:grid;place-items:center;\">⑂<\u002Fspan>Fork<\u002Fspan>\n        <span style=\"display:flex;gap:6px;align-items:center;\"><span style=\"width:22px;height:22px;border-radius:4px;background:#efeeea;color:#5f5e59;display:grid;place-items:center;\">↓<\u002Fspan>Download<\u002Fspan>\n        <span style=\"display:flex;gap:6px;align-items:center;\"><span style=\"width:22px;height:22px;border-radius:4px;background:#efeeea;color:#5f5e59;display:grid;place-items:center;\">↗<\u002Fspan>New referrer<\u002Fspan>\n        <span style=\"display:flex;gap:6px;align-items:center;\"><span style=\"width:22px;height:22px;border-radius:4px;background:#efeeea;color:#5f5e59;display:grid;place-items:center;\">▲<\u002Fspan>Traffic spike<\u002Fspan>\n        <span style=\"display:flex;gap:6px;align-items:center;\"><span style=\"width:22px;height:22px;border-radius:4px;background:#efeeea;color:#5f5e59;display:grid;place-items:center;\">+<\u002Fspan>New repo<\u002Fspan>\n        <span style=\"display:flex;gap:6px;align-items:center;\"><span style=\"width:22px;height:22px;border-radius:4px;background:#e7eefa;color:#2a78d6;display:grid;place-items:center;font-weight:700;\">!<\u002Fspan>Issue<\u002Fspan>\n        <span style=\"display:flex;gap:6px;align-items:center;\"><span style=\"width:22px;height:22px;border-radius:4px;background:#e7eefa;color:#2a78d6;display:grid;place-items:center;\">⇄<\u002Fspan>PR<\u002Fspan>\n        <span style=\"display:flex;gap:6px;align-items:center;\"><span style=\"width:22px;height:22px;border-radius:4px;background:#e7eefa;color:#2a78d6;display:grid;place-items:center;font-weight:700;\">“<\u002Fspan>Comment<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"font-size:12px;color:#5f5e59;text-wrap:pretty;\">Shape carries the type; blue marks only the events from other people that may need a reply.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:24px;\">\n      <div style=\"background:#fff;border:1px solid #e3e2de;border-radius:10px;padding:24px;display:flex;flex-direction:column;gap:12px;font-size:13px;line-height:1.5;\">\n        <div style=\"font-size:15px;font-weight:650;\">Components<\u002Fdiv>\n        <div><b>KPI tile<\u002Fb> — label 12 · value 30 · delta pill + “vs prev 14d”. Surface card, padding 16/18. 4-up desktop, 2×2 mobile.<\u002Fdiv>\n        <div><b>Event row<\u002Fb> — 24px glyph · text 14 · meta 12 · ✓ mark-seen (28px, 44px mobile). Repo name inline when alone, as group header when 2+.<\u002Fdiv>\n        <div><b>Repo card<\u002Fb> — name 15 + archived badge · 1-line description (ellipsis) · 3 metric cells (value 15, delta 12). Row on desktop, card with 3-col grid on mobile.<\u002Fdiv>\n        <div><b>Chart card<\u002Fb> — title 14 · optional note 12 · inline legend · canvas 280 (main) / 180 (secondary). Accent = the “people” series, grey = context.<\u002Fdiv>\n        <div><b>Collapsible section<\u002Fb> — native <code>&lt;details&gt;<\u002Fcode>, 48px summary with count. Tabs on desktop, accordion on mobile; one open at a time.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#fff;border:1px solid #e3e2de;border-radius:10px;padding:24px;display:flex;flex-direction:column;gap:10px;font-size:13px;line-height:1.5;\">\n        <div style=\"font-size:15px;font-weight:650;\">Hierarchy choices<\u002Fdiv>\n        <ol style=\"margin:0;padding-left:18px;display:flex;flex-direction:column;gap:8px;text-wrap:pretty;\">\n          <li><b>Answer first, browse second.<\u002Fb> KPI strip answers “did anything happen”, the feed answers “where / what”, the repo list is the third layer.<\u002Fli>\n          <li><b>Colour = meaning.<\u002Fb> Green only on gains, blue only on people-metrics and replies-needed. Everything else is greyscale, so a coloured mark always deserves a look.<\u002Fli>\n          <li><b>3 numbers, not 9.<\u002Fb> Visitors, stars, downloads per repo; referrers, releases, clones, pushes move to the detail page.<\u002Fli>\n          <li><b>Activity order + Quiet group<\u002Fb> pushes dead repos out of the way: the top row is always where things happened.<\u002Fli>\n          <li><b>One big chart.<\u002Fb> Visits gets full width; secondary charts share a 2-col grid; tables hide behind tabs.<\u002Fli>\n        <\u002Fol>\n      <\u002Fdiv>\n      <div style=\"background:#fff;border:1px dashed #2a78d6;border-radius:10px;padding:16px 20px;font-size:12px;line-height:1.5;color:#5f5e59;text-wrap:pretty;\"><b style=\"color:#1b1b19;\">API note — sparkline not included.<\u002Fb> A per-repo trend in the overview would need a new field (e.g. <code>daily_unique_visitors[]<\u002Fcode> in the repo summary). Until then the delta does the job.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"overview\" data-screen-label=\"Overview\" style=\"display:flex;flex-direction:column;gap:20px;\">\n  <h2 style=\"margin:0;font-size:24px;font-weight:650;\">1 · Overview<\u002Fh2>\n  <div style=\"display:flex;flex-wrap:wrap;gap:40px;align-items:flex-start;\">\n    <sc-for list=\"{{ themes }}\" as=\"t\" hint-placeholder-count=\"2\">\n      <div style=\"display:flex;flex-direction:column;gap:10px;\">\n        <div style=\"font-size:13px;color:#5f5e59;\">Desktop 1280 · {{ t.name }} — Quiet shown expanded<\u002Fdiv>\n        <div style=\"{{ t.vars }}\">\n          <div data-screen-label=\"Overview desktop\" style=\"width:1280px;box-sizing:border-box;background:var(--bg);color:var(--fg);font-size:14px;line-height:1.45;padding:28px 40px 48px;display:flex;flex-direction:column;gap:24px;border-radius:4px;\">\n            <header style=\"display:flex;align-items:flex-end;justify-content:space-between;gap:24px;\">\n              <div style=\"display:flex;flex-direction:column;gap:4px;\">\n                <div style=\"display:flex;align-items:baseline;gap:8px;\"><span style=\"font-size:18px;font-weight:650;letter-spacing:-0.01em;\">RepoWatch<\u002Fspan><span style=\"color:var(--fg-3);\">/<\u002Fspan><span style=\"font-size:15px;color:var(--fg-2);\">mrossi<\u002Fspan><\u002Fdiv>\n                <div style=\"font-size:12px;color:var(--fg-3);font-variant-numeric:tabular-nums;\">Last collected 3h ago · 12 repos · 0 errors<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:flex;gap:2px;padding:3px;background:var(--surface-2);border-radius:8px;\">\n                <sc-for list=\"{{ periods }}\" as=\"p\" hint-placeholder-count=\"5\">\n                  <sc-if value=\"{{ p.active }}\" hint-placeholder-val=\"{{ false }}\"><button sc-camel-on-click=\"{{ p.onClick }}\" style=\"border:0;background:var(--surface);color:var(--fg);font-weight:600;font-size:13px;padding:5px 14px;border-radius:6px;box-shadow:0 1px 2px rgba(0,0,0,0.12);cursor:pointer;\">{{ p.label }}<\u002Fbutton><\u002Fsc-if>\n                  <sc-if value=\"{{ p.inactive }}\" hint-placeholder-val=\"{{ true }}\"><button sc-camel-on-click=\"{{ p.onClick }}\" style=\"border:0;background:transparent;color:var(--fg-2);font-size:13px;padding:5px 14px;border-radius:6px;cursor:pointer;\">{{ p.label }}<\u002Fbutton><\u002Fsc-if>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fheader>\n            <div style=\"display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;\">\n              <sc-for list=\"{{ kpis }}\" as=\"k\" hint-placeholder-count=\"4\">\n                <div style=\"background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px 18px;display:flex;flex-direction:column;gap:6px;\">\n                  <div style=\"font-size:12px;font-weight:500;color:var(--fg-2);\">{{ k.label }}<\u002Fdiv>\n                  <div style=\"font-size:30px;font-weight:600;letter-spacing:-0.02em;line-height:1.1;font-variant-numeric:tabular-nums;\">{{ k.value }}<\u002Fdiv>\n                  <div style=\"display:flex;align-items:center;gap:6px;font-size:12px;font-variant-numeric:tabular-nums;\">\n                    <sc-if value=\"{{ k.d.pos }}\"><span style=\"background:var(--pos-soft);color:var(--pos);font-weight:600;padding:1px 6px;border-radius:4px;\">{{ k.d.txt }}<\u002Fspan><\u002Fsc-if>\n                    <sc-if value=\"{{ k.d.neg }}\"><span style=\"background:var(--surface-2);color:var(--fg-2);font-weight:500;padding:1px 6px;border-radius:4px;\">{{ k.d.txt }}<\u002Fspan><\u002Fsc-if>\n                    <span style=\"color:var(--fg-3);\">{{ kpiCaption }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:420px minmax(0,1fr);gap:20px;align-items:start;\">\n              <div style=\"background:var(--surface);border:1px solid var(--border);border-radius:10px;display:flex;flex-direction:column;\">\n                <div style=\"display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--border);\">\n                  <div style=\"display:flex;align-items:center;gap:8px;\"><span style=\"font-size:15px;font-weight:600;\">What's new<\u002Fspan><sc-if value=\"{{ hasNew }}\"><span style=\"background:var(--accent);color:#fff;font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;font-variant-numeric:tabular-nums;\">{{ newCount }}<\u002Fspan><\u002Fsc-if><\u002Fdiv>\n                  <div style=\"display:flex;align-items:center;gap:14px;font-size:13px;\">\n                    <sc-if value=\"{{ hasNew }}\"><button sc-camel-on-click=\"{{ markAll }}\" style=\"border:0;background:none;padding:0;color:var(--accent);cursor:pointer;font-size:13px;\">Mark all seen<\u002Fbutton><\u002Fsc-if>\n                    <a href=\"#\" style=\"color:var(--fg-2);\">History<\u002Fa>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"display:flex;flex-direction:column;padding:4px 18px;\">\n top:1px solid var(--border);\"><span style=\"flex:1;font-weight:600;\">{{ x.tag }}<\u002Fspan><span style=\"color:var(--fg-2);\">{{ x.date }}<\u002Fspan><span style=\"width:52px;text-align:right;\">{{ x.dl }}<\u002Fspan><\u002Fdiv><\u002Fsc-for><\u002Fdiv>\n              <\u002Fdetails>\n              <details style=\"border-top:1px solid var(--border);\">\n                <summary style=\"min-height:48px;display:flex;align-items:center;gap:8px;padding:0 14px;\"><span style=\"font-weight:600;\">External activity<\u002Fspan><span style=\"color:var(--accent);font-weight:600;\">4<\u002Fspan><span style=\"margin-left:auto;color:var(--fg-3);\">▾<\u002Fspan><\u002Fsummary>\n                <div style=\"padding:0 14px 6px;\"><sc-for list=\"{{ external }}\" as=\"x\" hint-placeholder-count=\"4\"><div style=\"display:flex;flex-direction:column;padding:9px 0;border-top:1px solid var(--border);\"><span>{{ x.num }} {{ x.title }}<\u002Fspan><span style=\"font-size:12px;color:var(--fg-3);\">{{ x.who }} · {{ x.when }}<\u002Fspan><\u002Fdiv><\u002Fsc-for><\u002Fdiv>\n              <\u002Fdetails>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"empty\" data-screen-label=\"Empty states\" style=\"display:flex;flex-direction:column;gap:20px;\">\n  <h2 style=\"margin:0;font-size:24px;font-weight:650;\">3 · Empty states<\u002Fh2>\n  <div style=\"display:flex;flex-wrap:wrap;gap:40px;align-items:flex-start;\">\n    <sc-for list=\"{{ themes }}\" as=\"t\" hint-placeholder-count=\"2\">\n      <div style=\"{{ t.vars }}\">\n        <div style=\"background:var(--bg);color:var(--fg);padding:24px;border-radius:4px;display:flex;gap:16px;align-items:flex-start;font-size:14px;line-height:1.45;\">\n          <div style=\"width:360px;display:flex;flex-direction:column;gap:8px;\">\n            <div style=\"font-size:12px;color:var(--fg-3);\">No new events · {{ t.name }}<\u002Fdiv>\n            <div style=\"background:var(--surface);border:1px solid var(--border);border-radius:10px;\">\n              <div style=\"display:flex;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--border);\"><span style=\"font-size:15px;font-weight:600;\">What's new<\u002Fspan><a href=\"#\" style=\"font-size:13px;color:var(--fg-2);\">History<\u002Fa><\u002Fdiv>\n              <div style=\"padding:28px 18px;text-align:center;display:flex;flex-direction:column;gap:4px;\"><div style=\"font-weight:600;\">Nothing new since your last visit<\u002Fdiv><div style=\"font-size:13px;color:var(--fg-2);\">Past events stay in <a href=\"#\" style=\"color:var(--accent);\">History<\u002Fa>.<\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"width:360px;display:flex;flex-direction:column;gap:8px;\">\n            <div style=\"font-size:12px;color:var(--fg-3);\">No data collected yet<\u002Fdiv>\n            <div style=\"background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:20px;display:flex;flex-direction:column;gap:12px;\">\n              <div style=\"font-size:12px;color:var(--fg-3);\">Last collected — · 0 repos · 0 errors<\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:8px;\">\n                <div style=\"border:1px dashed var(--border);border-radius:8px;padding:10px;font-size:12px;color:var(--fg-3);\">Unique visitors<div style=\"font-size:20px;color:var(--fg-3);\">—<\u002Fdiv><\u002Fdiv>\n                <div style=\"border:1px dashed var(--border);border-radius:8px;padding:10px;font-size:12px;color:var(--fg-3);\">New stars<div style=\"font-size:20px;color:var(--fg-3);\">—<\u002Fdiv><\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"font-weight:600;\">No data collected yet<\u002Fdiv>\n              <div style=\"font-size:13px;color:var(--fg-2);text-wrap:pretty;\">Numbers appear after the first collection run finishes. GitHub only keeps 14 days of traffic, so history starts from that run.<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"width:360px;display:flex;flex-direction:column;gap:8px;\">\n            <div style=\"font-size:12px;color:var(--fg-3);\">Repo without releases<\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:8px;\">\n              <div style=\"background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;\">\n                <div style=\"font-size:12px;font-weight:500;color:var(--fg-2);\">Downloads<\u002Fdiv>\n                <div style=\"font-size:24px;font-weight:600;color:var(--fg-3);\">—<\u002Fdiv>\n                <div style=\"font-size:12px;color:var(--fg-3);\">No releases<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;\">\n                <span style=\"font-size:14px;font-weight:600;\">Downloads by asset<\u002Fspan>\n                <div style=\"height:90px;border:1px dashed var(--border);border-radius:8px;display:grid;place-items:center;font-size:13px;color:var(--fg-2);padding:0 16px;text-align:center;\">No releases yet. Counts appear once a release has assets.<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"font-size:12px;color:var(--fg-3);text-wrap:pretty;\">PyPI card is omitted entirely when the repo has no package.<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n<\u002Fsection>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = { period: '14d', seen: {}, showAll: false, tab: 'ref' };\n  componentDidMount() {\n    this._iv = setInterval(() => { if (window.Chart && document.querySelector('canvas[data-chart]')) { clearInterval(this._iv); this.initCharts(); } }, 150);\n  }\n  componentDidUpdate() { if (window.Chart) this.initCharts(); }\n  componentWillUnmount() { clearInterval(this._iv); }\n  initCharts() {\n    const days = ['Oct 18','Oct 19','Oct 20','Oct 21','Oct 22','Oct 23','Oct 24','Oct 25','Oct 26','Oct 27','Oct 28','Oct 29','Oct 30','Oct 31'];\n    const data = {\n      uniq: [14,11,16,13,9,8,15,17,12,14,13,302,141,63],\n      views: [38,29,44,35,22,19,41,47,30,36,33,980,410,180],\n      clones: [9,7,11,8,6,5,10,12,9,8,7,14,11,9],\n      ci: [6,5,8,6,4,4,7,9,6,6,5,7,6,5],\n      stars: [1191,1191,1191,1192,1192,1192,1192,1192,1192,1192,1192,1203,1209,1212],\n      pypi: [42,38,51,47,30,28,55,61,49,52,46,140,98,72]\n    };\n    const hexA = (h, a) => { h = h.replace('#',''); const n = parseInt(h, 16); return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`; };\n    document.querySelectorAll('canvas[data-chart]').forEach(c => {\n      if (c._ch) return;\n      const cs = getComputedStyle(c), v = n => cs.getPropertyValue(n).trim() || '#888';\n      const acc = v('--accent'), g = v('--fg-3'), grid = v('--border'), tick = v('--fg-3');\n      const maxT = +(c.dataset.ticks || 7);\n      const font = { family: \"-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif\", size: 11 };\n      const scales = {\n        x: { grid: { display: false }, border: { color: grid }, ticks: { color: tick, font, maxTicksLimit: maxT, maxRotation: 0 } },\n        y: { grid: { color: grid }, border: { display: false }, ticks: { color: tick, font, maxTicksLimit: 4 } }\n      };\n      const base = { responsive: true, maintainAspectRatio: false, animation: false, plugins: { legend: { display: false }, tooltip: { mode: 'index', intersect: false } }, interaction: { mode: 'index', intersect: false }, scales };\n      let cfg;\n      const k = c.dataset.chart;\n      if (k === 'visits') cfg = { type: 'line', data: { labels: days, datasets: [\n        { label: 'Unique visitors', data: data.uniq, borderColor: acc, backgroundColor: hexA(acc, 0.08), fill: true, borderWidth: 2, pointRadius: 0, tension: 0.25 },\n        { label: 'Views', data: data.views, borderColor: g, borderWidth: 1.5, pointRadius: 0, tension: 0.25 } ] }, options: base };\n      if (k === 'clones') cfg = { type: 'bar', data: { labels: days, datasets: [\n        { label: 'Clones', data: data.clones, backgroundColor: acc, borderRadius: 2, barPercentage: 0.9, categoryPercentage: 0.7 },\n        { label: 'CI checkouts', data: data.ci, backgroundColor: hexA(g.startsWith('#') ? g : '#888888', 0.6), borderRadius: 2, barPercentage: 0.9, categoryPercentage: 0.7 } ] }, options: base };\n      if (k === 'stars') cfg = { type: 'line', data: { labels: days, datasets: [\n        { label: 'Stars', data: data.stars, borderColor: acc, borderWidth: 2, pointRadius: 0, stepped: true } ] }, options: base };\n      if (k === 'pypi') cfg = { type: 'bar', data: { labels: days, datasets: [\n        { label: 'PyPI downloads', data: data.pypi, backgroundColor: acc, borderRadius: 2 } ] }, options: base };\n      if (k === 'assets') cfg = { type: 'bar', data: { labels: ['linux-x86_64.tar.gz','macos-arm64.tar.gz','windows-x64.zip','source.tar.gz'], datasets: [\n        { label: 'Downloads', data: [512,388,201,79], backgroundColor: acc, borderRadius: 2, barThickness: 14 } ] },\n        options: { ...base, indexAxis: 'y', scales: {\n          x: { grid: { color: grid }, border: { display: false }, ticks: { color: tick, font, maxTicksLimit: 4 } },\n          y: { grid: { display: false }, border: { color: grid }, ticks: { color: v('--fg-2'), font } } } } };\n      if (cfg) c._ch = new window.Chart(c, cfg);\n    });\n  }\n  renderVals() {\n    const s = this.state;\n    const D = (txt, k) => ({ txt, pos: k === 'p', neg: k === 'n', flat: k === 'f' });\n    const light = { '--bg':'#f6f6f4','--surface':'#ffffff','--surface-2':'#efeeea','--border':'#e3e2de','--fg':'#1b1b19','--fg-2':'#5f5e59','--fg-3':'#83827c','--accent':'#2a78d6','--accent-soft':'#e7eefa','--pos':'#1f8a4c','--pos-soft':'#e4f3ea', fontFamily:\"-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif\" };\n    const dark = { '--bg':'#121211','--surface':'#1b1b1a','--surface-2':'#252523','--border':'#2e2e2b','--fg':'#ecebe7','--fg-2':'#a8a7a1','--fg-3':'#7c7b75','--accent':'#4a90e2','--accent-soft':'#1a2a3d','--pos':'#4cbf7a','--pos-soft':'#16291d', fontFamily: light.fontFamily };\n    const themes = [{ name: 'Light', vars: light }, { name: 'Dark', vars: dark }];\n    const periods = ['7d','14d','30d','90d','All'].map(l => ({ label: l, active: s.period === l, inactive: s.period !== l, onClick: () => this.setState({ period: l }) }));\n    const kpiCaption = s.period === 'All' ? 'all time' : 'vs prev ' + s.period;\n    const kpis = [\n      { label: 'Unique visitors', value: '1,284', d: D('↑ 38%', 'p') },\n      { label: 'New stars', value: '47', d: D('↑ 12', 'p') },\n      { label: 'Downloads', value: '3,906', d: D('↑ 6%', 'p') },\n      { label: 'External activity', value: '9', d: D('↓ 2', 'n') }\n    ];\n    const M = (v, vd, st, sd, dl, dd) => [\n      { short: 'Visitors', w: '110px', value: v, d: vd },\n      { short: 'New stars', w: '90px', value: st, d: sd },\n      { short: 'Downloads', w: '100px', value: dl, d: dd }\n    ];\n    const repos = [\n      { name: 'tidyparse', desc: 'Fast, forgiving parser for messy CSV and TSV exports', metrics: M('642', D('↑ 310%','p'), '21', D('↑ 17','p'), '1,180', D('↑ 14%','p')) },\n      { name: 'pgdiff', desc: 'Schema diff and migration preview for PostgreSQL databases', metrics: M('218', D('↑ 22%','p'), '9', D('↑ 4','p'), '640', D('↓ 8%','n')) },\n      { name: 'md2slides', desc: 'Turn a Markdown file into a self-contained HTML slide deck', metrics: M('164', D('↑ 5%','p'), '6', D('↓ 2','n'), '1,402', D('↑ 31%','p')) },\n      { name: 'fluxcli', desc: 'Terminal client for InfluxDB with saved queries and charts', metrics: M('131', D('↓ 12%','n'), '7', D('↑ 3','p'), '512', D('↑ 2%','p')) },\n      { name: 'tinyqueue', desc: 'Minimal job queue for Python on top of Redis', metrics: M('86', D('↑ 9%','p'), '3', D('↑ 1','p'), '172', D('↓ 20%','n')) },\n      { name: 'old-blog', archived: true, desc: 'Source of my previous Jekyll blog, kept for the links', metrics: M('43', D('↓ 30%','n'), '1', D('—','f'), '—', D('no releases','f')) }\n    ];\n    const quiet = [\n      { name: 'rw-exporter', desc: 'Prometheus exporter for RepoWatch metrics' },\n      { name: 'homelab-scripts', desc: 'Backup and maintenance scripts for my home server' },\n      { name: 'ble-scale', desc: 'Read weight from cheap Bluetooth kitchen scales' },\n      { name: 'ansible-pi', desc: 'Ansible roles for provisioning Raspberry Pi nodes' },\n      { name: 'dotfiles', desc: 'Shell, editor and terminal configuration' },\n      { name: 'advent-2023', archived: true, desc: 'Advent of Code 2023 solutions in Rust' }\n    ];\n    const allEvents = [\n      { id: 1, repo: 'tidyparse', glyph: '▲', text: 'Traffic spike: 302 unique visitors on Oct 29', meta: 'Oct 29 · usual day ≈ 13' },\n      { id: 2, repo: 'tidyparse', glyph: '↗', text: 'New referrer: news.ycombinator.com', meta: '318 unique visitors · first seen Oct 29' },\n      { id: 3, repo: 'tidyparse', glyph: '★', text: '21 new stars', meta: 'Oct 29 – Oct 31' },\n      { id: 4, repo: 'pgdiff', glyph: '!', ext: true, text: 'Issue #42 · Fails on partitioned tables', meta: '@kwanj · 5h ago' },\n      { id: 5, repo: 'pgdiff', glyph: '“', ext: true, text: 'Comment on #38 · Add --schema flag', meta: '@lhdev · 1d ago' },\n      { id: 6, repo: 'md2slides', glyph: '↓', text: 'v1.4.0 passed 1,000 downloads', meta: '2d ago' },\n      { id: 7, repo: 'tinyqueue', glyph: '⇄', ext: true, text: 'PR #17 · Support Redis streams', meta: '@okafor · 4d ago' },\n      { id: 8, repo: 'fluxcli', glyph: '⑂', text: 'Forked by @tamsin-io', meta: '3d ago' },\n      { id: 9, repo: 'rw-exporter', glyph: '+', text: 'New repo tracked', meta: 'First collected 6d ago' }\n    ];\n    const unseen = allEvents.filter(e => !s.seen[e.id]);\n    const shown = s.showAll ? unseen : unseen.slice(0, 5);\n    const groups = [];\n    shown.forEach(e => {\n      let g = groups[groups.length - 1];\n      if (!g || g.repo !== e.repo) { g = { repo: e.repo, events: [] }; groups.push(g); }\n      g.events.push(e);\n    });\n    groups.forEach(g => {\n      g.multi = g.events.length > 1;\n      g.countLabel = g.events.length + ' events';\n      g.events = g.events.map(e => ({ ...e, ext: !!e.ext, plain: !e.ext, showRepo: !g.multi,\n        onSeen: () => this.setState(st => ({ seen: { ...st.seen, [e.id]: true } })) }));\n    });\n    const tabDefs = [['ref','Referring sites','6'],['pages','Popular pages','5'],['all','Every referrer seen','7'],['rel','Releases','4'],['ext','External activity','4']];\n    const tabs = tabDefs.map(([key, label, count]) => ({ label, count, active: s.tab === key, inactive: s.tab !== key, onClick: () => this.setState({ tab: key }) }));\n    const tabIs = Object.fromEntries(tabDefs.map(([k]) => [k, s.tab === k]));\n    return {\n      themes, periods, period: s.period, kpiCaption, kpis, repos, quiet, groups,\n      newCount: String(unseen.length), hasNew: unseen.length > 0, feedEmpty: unseen.length === 0,\n      hasMore: unseen.length > 5, moreLabel: s.showAll ? 'Show fewer' : `Show all (${unseen.length})`,\n      toggleAll: () => this.setState(st => ({ showAll: !st.showAll })),\n      markAll: () => this.setState({ seen: Object.fromEntries(allEvents.map(e => [e.id, true])) }),\n      detailKpis: [\n        { label: 'Stars', value: '1,212', d: D('+21', 'p'), cap: 'in 14d' },\n        { label: 'Unique visitors', value: '642', d: D('↑ 310%', 'p'), cap: 'vs prev 14d' },\n        { label: 'Downloads', value: '1,180', d: D('↑ 14%', 'p'), cap: 'vs prev 14d' },\n        { label: 'Clones', value: '146', d: D('↑ 8%', 'p'), cap: 'vs prev 14d · incl. CI' }\n      ],\n      tabs, tabIs,\n      referrers: [\n        { src: 'news.ycombinator.com', views: '1,020', uniq: '318' }, { src: 'github.com', views: '212', uniq: '96' },\n        { src: 'google.com', views: '140', uniq: '88' }, { src: 'reddit.com', views: '96', uniq: '61' },\n        { src: 'duckduckgo.com', views: '22', uniq: '19' }, { src: 'lobste.rs', views: '18', uniq: '14' }\n      ],\n      pages: [\n        { path: '/mrossi/tidyparse', views: '1,240', uniq: '540' }, { path: '/mrossi/tidyparse/blob/main/README.md', views: '210', uniq: '120' },\n        { path: '/mrossi/tidyparse/releases', views: '188', uniq: '101' }, { path: '/mrossi/tidyparse/issues', views: '74', uniq: '40' },\n        { path: '/mrossi/tidyparse/wiki/Dialects', views: '41', uniq: '22' }\n      ],\n      allRefs: [\n        { src: 'news.ycombinator.com', first: 'Oct 29, 2026', isNew: true, total: '318' }, { src: 'lobste.rs', first: 'Oct 30, 2026', isNew: true, total: '14' },\n        { src: 'github.com', first: 'Mar 2, 2025', total: '1,204' }, { src: 'google.com', first: 'Mar 2, 2025', total: '860' },\n        { src: 'reddit.com', first: 'Jun 11, 2025', total: '233' }, { src: 'duckduckgo.com', first: 'Apr 5, 2025', total: '97' },\n        { src: 'stackoverflow.com', first: 'Aug 20, 2026', total: '41' }\n      ],\n      releases: [\n        { tag: 'v1.8.0', date: 'Oct 27, 2026', dl: '1,180' }, { tag: 'v1.7.2', date: 'Sep 9, 2026', dl: '2,410' },\n        { tag: 'v1.7.0', date: 'Aug 1, 2026', dl: '3,050' }, { tag: 'v1.6.0', date: 'May 18, 2026', dl: '1,922' }\n      ],\n      external: [\n        { glyph: '!', num: '#88', title: 'Quoted newlines break row count', who: '@pvl', when: 'Oct 30' },\n        { glyph: '⇄', num: '#87', title: 'Add Polars output', who: '@jsun', when: 'Oct 30' },\n        { glyph: '“', num: '#85', title: 'Comment on “Detect delimiter from header”', who: '@mariak', when: 'Oct 29' },\n        { glyph: '!', num: '#86', title: 'Encoding detection on Windows', who: '@t-ono', when: 'Oct 29' }\n      ]\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody
